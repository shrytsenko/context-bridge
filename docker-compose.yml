services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contextbridge}
      POSTGRES_USER: ${POSTGRES_USER:-contextbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextbridge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contextbridge} -d ${POSTGRES_DB:-contextbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__ContextBridge: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-contextbridge};Username=${POSTGRES_USER:-contextbridge};Password=${POSTGRES_PASSWORD:-contextbridge}"
      Authentication__ApiKey: ${CONTEXTBRIDGE_API_KEY:-local-dev-key}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
